name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows VST3 (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache JUCE download
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build (Release)
        run: cmake --build build --config Release --parallel

      - name: Validate with pluginval (strictness 10)
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          .\pluginval\pluginval.exe --strictness-level 10 --validate-in-process --timeout-ms 600000 --output-dir pluginval-logs --validate "build\MultiRack_artefacts\Release\VST3\Multi Rack.vst3"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -Recurse "build\MultiRack_artefacts\Release\VST3\Multi Rack.vst3" dist\
          Copy-Item "build\MultiRack_artefacts\Release\Standalone\Multi Rack.exe" dist\
          Copy-Item README.md dist\
          Compress-Archive -Path dist\* -DestinationPath MultiRack-Windows-x64.zip -Force

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: MultiRack-Windows-x64
          path: MultiRack-Windows-x64.zip

      - name: Upload pluginval logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pluginval-logs
          path: pluginval-logs
          if-no-files-found: ignore

      - name: Publish release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: MultiRack-Windows-x64.zip

  tests:
    name: DSP / state / UI tests (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxext-dev libfreetype-dev libfontconfig1-dev libgl1-mesa-dev

      - name: Build test harness
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DMR_BUILD_TESTS=ON
          cmake --build build --target MultiRackTest

      - name: Run tests
        run: ./build/MultiRackTest_artefacts/Release/MultiRackTest ui-screenshot.png

      - name: Upload UI screenshot
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshot
          path: ui-screenshot.png
